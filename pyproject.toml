[project]
name = "lfm"
version = "1.0.0"
description = "Local LFM3 chat and agent in your terminal, powered by llama.cpp."
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
lfm = "lfm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lfm"]
